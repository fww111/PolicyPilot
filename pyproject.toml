[project]
name = "competition"
version = "0.1.0"
description = "Domain asset cognition and decision system built on Nexent (ICT contest track 3)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = [
    "fastmcp>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "charset-normalizer>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/competition"]

[tool.pytest.ini_options]
testpaths = ["tests"]
