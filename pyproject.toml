[project]
name = "policy-pilot"
version = "0.1.0"
description = "PolicyPilot 可进化惠企政策决策智能体 — 第十一届华为ICT大赛创新赛赛题3（基于 ModelEngine Nexent）"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.7",
    "openai>=1.50",
    "neo4j>=5.23",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "pdfplumber>=0.11",
    "mcp>=1.2",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "lightrag-hku>=1.5.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_pilot"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
